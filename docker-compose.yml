# =============================================================================
# EvidenceGraph — Docker Compose
# One command:  docker compose up --build
#   frontend  -> http://localhost:5173   (nginx serves the SPA + proxies /api)
#   backend   -> http://localhost:8000   (FastAPI; runs migrations on start)
#   API docs  -> http://localhost:8000/docs
# Database: Supabase PostgreSQL (external, SSL). All secrets come from .env.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Redis — cache + background webhook queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: evidencegraph_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - evidencegraph_net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI -> Supabase PostgreSQL + Redis
  # DATABASE_URL and the RAZORPAY_* / AI_* vars come from .env (env_file).
  # entrypoint.sh runs `alembic upgrade head` before starting uvicorn.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidencegraph_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Redis resolves to the compose service name inside the network
      REDIS_URL: redis://redis:6379/0
      # Seed the 20 golden delivery-dispute cases on first boot (idempotent).
      # Set SEED_GOLDEN_CASES=false in .env to skip.
      SEED_GOLDEN_CASES: ${SEED_GOLDEN_CASES:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      # First boot can wait on a cold Supabase project + run migrations.
      start_period: 150s
    networks:
      - evidencegraph_net

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite build, served by nginx (proxies /api -> backend)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty -> the bundle calls same-origin '/api/*'; nginx proxies it.
        VITE_API_BASE_URL: ""
    container_name: evidencegraph_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - evidencegraph_net

volumes:
  redis_data:
    driver: local

networks:
  evidencegraph_net:
    driver: bridge
    driver_opts:
      # Docker Desktop on Windows/WSL2 (and some VPNs) route container traffic
      # over a link with a sub-1500 MTU. Left at the 1500 default, PostgreSQL's
      # TLS handshake packets to Supabase get silently dropped —
      # "SSL SYSCALL error: EOF detected". 1400 is safe almost everywhere;
      # drop to 1350 / 1280 if the error persists (see docs/RUN.md).
      com.docker.network.driver.mtu: "1400"
