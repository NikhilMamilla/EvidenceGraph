# =============================================================================
# EvidenceGraph — Docker Compose
# Supabase Migration: local postgres removed, backend connects to Supabase.
# =============================================================================
# Services: redis, backend, frontend
# Database: Supabase PostgreSQL (external, SSL-secured)
# All secrets come from the .env file — never hardcoded here.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Redis — local cache layer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: evidencegraph_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - evidencegraph_net

  # ---------------------------------------------------------------------------
  # Backend — FastAPI → Supabase PostgreSQL + Redis
  # DATABASE_URL comes from .env (Supabase connection string with SSL)
  # Do NOT override DATABASE_URL here — let it come through from .env
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidencegraph_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Redis uses the Docker service name inside the compose network
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - evidencegraph_net

  # ---------------------------------------------------------------------------
  # Frontend — React + Vite (served via nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evidencegraph_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - evidencegraph_net

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  evidencegraph_net:
    driver: bridge
