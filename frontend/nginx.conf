# =============================================================================
# EvidenceGraph frontend — nginx
# Serves the built SPA and reverse-proxies the API to the backend container.
# =============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS — re-resolve "backend" per request so a backend
    # container restart doesn't leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- API + health -> backend ------------------------------------------
    # Every component fetches same-origin '/api/v1/...', so nginx forwards those
    # (and the SSE stream) to the FastAPI container on the compose network.
    location /api/ {
        set $upstream_backend "backend:8000";
        proxy_pass http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Server-Sent Events: /api/v1/stream/events must not be buffered
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    location = /health {
        set $upstream_health "backend:8000";
        proxy_pass http://$upstream_health;
        proxy_set_header Host $host;
    }

    # ---- SPA fallback ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
